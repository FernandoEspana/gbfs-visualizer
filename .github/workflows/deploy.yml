name: Deploy static content pages
on:
  push:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7

      - name: Install Dependencies
        run: npm install

      - name: Build GBFS-Visualizer
        run: npm run build

      - name: Artifact Upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: gitHub-pages
          path: dist/gbfs-visualizer/browser

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to gitHub
        id: deployment
        uses: actions/deploy-pages@v4
